# ============================================================================
#  Déploiement automatique sur VPS LWS (diambra.net)
# ============================================================================
#
#  Configuration des Secrets GitHub (Settings → Secrets and variables → Actions) :
#
#    VPS_HOST       : Adresse IP ou domaine du VPS
#    VPS_USER       : root (ou utilisateur sudo)
#    VPS_SSH_KEY    : Clé privée (contenu COMPLET avec début/fin)
#    VPS_SSH_PORT   : 22 (optionnel)
#
#  ============================================================================
#  Générer et formater la clé SSH sur votre VPS :
#
#    ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
#    cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
#    cat ~/.ssh/id_rsa
#
#  Copier la sortie COMPLÈTE (y compris "-----BEGIN OPENSSH PRIVATE KEY-----")
# ============================================================================

name: 🚀 Déployer sur VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 📦 Déployer diambra.net
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Vérification du code
        uses: actions/checkout@v4

      - name: 🔧 Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: 🧪 Vérification TypeScript et lint
        run: |
          npm run lint || echo "⚠️ Linting ignoré"
          if [ -f "package.json" ] && grep -q '"type-check"' package.json; then
            npm run type-check
          fi
        continue-on-error: true

      - name: 🔍 Diagnostic et correction de la structure
        id: structure
        run: |
          echo "📂 Structure du projet :"
          ls -la
          echo ""
          
          echo "📂 Contenu de src/ :"
          if [ -d "src" ]; then
            ls -la src/
          fi
          echo ""
          
          # Vérifier si le dossier pages/ est vide ou inutile
          if [ -d "src/pages" ] && [ -d "src/app" ]; then
            echo "🔍 Vérification du contenu de pages/ :"
            if [ -z "$(ls -A src/pages 2>/dev/null)" ]; then
              echo "📁 Le dossier pages/ est vide. Suppression car vous utilisez App Router."
              rm -rf src/pages
              echo "✅ Dossier pages/ supprimé"
            else
              echo "📁 Le dossier pages/ contient des fichiers."
              echo "   Si vous utilisez App Router, vous pouvez supprimer ce dossier."
              echo "   Pour conserver les deux routers, ajoutez un fichier _document.tsx"
            fi
          fi
          
          # Vérifier la présence de layout.tsx (signe qu'on utilise App Router)
          if [ -d "src/app" ] && [ -f "src/app/layout.tsx" ]; then
            echo "✅ App Router détecté (layout.tsx présent)"
          fi

      - name: 🔨 Build du projet (avec débogage)
        id: build
        run: |
          echo "🔨 Build avec débogage..."
          if ! npm run build -- --debug-prerender; then
            echo "⚠️ Build échoué. Tentative de correction..."
            
            # Si l'erreur est liée à _document, créer un fichier minimal
            if [ -d "src/pages" ] && [ ! -f "src/pages/_document.tsx" ] && [ ! -f "src/pages/_document.js" ]; then
              echo "📝 Création d'un fichier _document.tsx minimal..."
              mkdir -p src/pages
              cat > src/pages/_document.tsx << 'EOF'
          import { Html, Head, Main, NextScript } from 'next/document'
          
          export default function Document() {
            return (
              <Html lang="fr">
                <Head />
                <body>
                  <Main />
                  <NextScript />
                </body>
              </Html>
            )
          }
          EOF
              echo "✅ Fichier _document.tsx créé"
            fi
            
            # Nouvelle tentative de build
            echo "🔨 Nouvelle tentative de build..."
            npm run build -- --debug-prerender
          fi
        env:
          NEXT_PUBLIC_SITE_URL: https://diambra.net
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📊 Analyse du bundle (optionnel)
        run: |
          npm run build -- --analyze || echo "Analyse non disponible"
        continue-on-error: true

      - name: 🔧 Installation de PM2 et outils (via SSH)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 10m
          script: |
            # Mise à jour des outils système
            apt-get update -qq && apt-get install -y -qq git curl
            
            # Installation de Node.js 20 si nécessaire
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            
            # Installation de PM2 si nécessaire
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2@latest
            fi
            
            # Vérification des versions
            echo "Node.js version: $(node -v)"
            echo "NPM version: $(npm -v)"
            echo "PM2 version: $(pm2 -v)"

      - name: 🚀 Déploiement de l'application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -e
            
            APP_DIR="/var/www/diambrafrontend"
            PM2_NAME="diambrafrontend"
            NEXT_PORT="3000"
            
            echo "========================================="
            echo "🚀 Déploiement: $PM2_NAME"
            echo "📂 Dossier: $APP_DIR"
            echo "🕐 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="
            
            # Création du dossier s'il n'existe pas
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Sauvegarde du package.json local avant pull
            if [ -f "package.json" ]; then
              cp package.json package.json.backup
            fi
            
            # Git pull
            echo "📥 Récupération du code depuis GitHub..."
            git fetch origin
            git checkout main || git checkout master
            git pull origin main || git pull origin master
            
            # Vérification de la structure
            echo "📂 Vérification de la structure du projet :"
            ls -la
            if [ -d "src" ]; then
              echo "📂 Contenu de src/ :"
              ls -la src/
            fi
            
            # Correction automatique si pages/ existe mais pas _document
            if [ -d "src/pages" ] && [ ! -f "src/pages/_document.tsx" ] && [ ! -f "src/pages/_document.js" ]; then
              echo "📝 Création de _document.tsx manquant..."
              mkdir -p src/pages
              cat > src/pages/_document.tsx << 'EOF'
          import { Html, Head, Main, NextScript } from 'next/document'
          
          export default function Document() {
            return (
              <Html lang="fr">
                <Head />
                <body>
                  <Main />
                  <NextScript />
                </body>
              </Html>
            )
          }
          EOF
              echo "✅ _document.tsx créé"
            fi
            
            # Nettoyage du cache npm si nécessaire
            if [ -f "package-lock.json" ]; then
              echo "🧹 Nettoyage du cache npm..."
              npm cache clean --force
            fi
            
            # Installation des dépendances avec legacy-peer-deps
            echo "📦 Installation des dépendances..."
            npm install --legacy-peer-deps
            
            # Build du projet avec vérification des erreurs
            echo "🔨 Build du projet..."
            if ! npm run build; then
              echo "⚠️ Build échoué, tentative avec nettoyage du cache..."
              rm -rf .next node_modules/.cache
              npm run build
            fi
            
            # Configuration du port (évite les conflits)
            export PORT=$NEXT_PORT
            
            # Gestion du processus PM2
            echo "🔄 Gestion du processus PM2..."
            if pm2 list | grep -q "$PM2_NAME"; then
              echo "🔄 Restart de l'application..."
              pm2 restart "$PM2_NAME" --update-env
            else
              echo "🚀 Démarrage de l'application..."
              pm2 start npm --name "$PM2_NAME" -- start -- --port $NEXT_PORT
            fi
            
            # Sauvegarde de la configuration PM2
            pm2 save
            pm2 startup || echo "PM2 startup config échouée (ignorée)"
            
            # Nettoyage des anciens builds
            echo "🧹 Nettoyage des anciens caches..."
            find . -name ".next" -type d -mtime +5 -exec rm -rf {} \; 2>/dev/null || true
            
            echo "========================================="
            echo "✅ Déploiement terminé avec succès !"
            echo "🌐 https://diambra.net"
            echo "📊 PM2 status:"
            pm2 status
            echo "========================================="

      - name: ✅ Vérification du déploiement
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 2m
          script: |
            # Vérification que l'application tourne
            sleep 10
            if pm2 list | grep -q "diambrafrontend.*online"; then
              echo "✅ L'application est en ligne !"
              pm2 logs diambrafrontend --lines 10 --nostream
            else
              echo "⚠️ L'application semble avoir un problème"
              pm2 logs diambrafrontend --lines 20 --nostream
              exit 1
            fi

      - name: 📝 Création du fichier .env de production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            APP_DIR="/var/www/diambrafrontend"
            cd "$APP_DIR"
            
            # Création du fichier .env.production si inexistant
            if [ ! -f ".env.production" ]; then
              printf 'NODE_ENV=production\n' > .env.production
              printf 'NEXT_PUBLIC_SITE_URL=https://diambra.net\n' >> .env.production
              printf 'PORT=3000\n' >> .env.production
              echo "✅ Fichier .env.production créé"
            fi

      - name: 🧹 Nettoyage des anciens déploiements
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            # Nettoyage des anciens logs PM2
            pm2 flush
            
            # Nettoyage du cache npm global
            npm cache clean --force || true
            
            echo "🧹 Nettoyage terminé"

      - name: 📢 Notification d'échec
        if: failure()
        run: |
          echo "❌ Le déploiement a échoué !"
          echo "Vérifiez les logs ci-dessus pour plus de détails."
          echo "🔍 Erreur de build détectée. Utilisez --debug-prerender pour plus d'informations."